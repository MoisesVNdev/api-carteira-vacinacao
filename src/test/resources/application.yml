spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: HikariPoolH2Test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Segredo usado só nos testes (nunca use este valor fora deles)
jwt:
  secret: dGVzdGUtc29tZW50ZS1jaGF2ZS1qd3QtcGFyYS1vcy10ZXN0ZXMtYXV0b21hdGl6YWRvcy0yNTZiaXRz
  expiration: 3600000

# Reduce logging noise during tests
logging:
  level:
    root: WARN
    org.hibernate.SQL: DEBUG
